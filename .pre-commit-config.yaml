# Experiment artefacts, datasets and the campus model are hashed or recorded
# as produced, so the text fixers leave them untouched.
exclude: ^(experiments/|data/|config/|pddl/problems/|mobile_app/(android|ios|linux|macos|windows|web)/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
